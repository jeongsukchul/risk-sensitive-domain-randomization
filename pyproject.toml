[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-sensitive-domain-randomization"
version = "0.1.0"
description = "Risk-sensitive domain randomization with variational samplers and PPO"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["learning*", "custom_envs*"]
exclude = ["*.logs*", "*.outputs*", "*.wandb*", "*.plots*", "*.toy_experiments*"]

[tool.setuptools.package-data]
learning = ["**/*.yaml", "**/*.yml"]
custom_envs = ["**/*.xml", "**/*.png", "**/*.obj"]
