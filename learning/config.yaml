# defaults:
#     - override hydra/launcher: submitit_local
# training
num_envs: null  # null keeps the task-specific PPO default
batch_size: null
num_timesteps: null
# environment
benchmark: dm_control
task: CheetahRun
obs: state
exp_name : test

# evaluation
checkpoint: ???
impl : warp #or jax
eval_with_training_env : false #added
num_evals: null
eval_grid_size_2d: 128
empirical_num_rollouts: 10  # independent sampler-matched target estimates
empirical_clip_negative_rewards: false
training_log_freq: 5  # training updates between buffered metric records; 0 disables
profile_training_cost: false  # true records synchronized rollout/update phase times

#policy
policy : ppo
asymmetric_critic: true
distributional_q : false

# logging
wandb_project: rsdr
wandb_entity: null  # uses the account configured by wandb login
wandb_silent: false
use_wandb: true
save_csv: true
comment: ''
nonstationary : false

#domain randomization
randomization: true
final_randomization: true
custom_wrapper: true
dr_train_ratio : 1.
group: ???
# epopt
epsilon : 0.1
# GMMVI cfg
scheduler_lr : 0.2
scheduler_window_size: 20
start_beta : 0.
end_beta : -5.
scheduler_mode : 'linear'  # 'linear' or 'exp'
# Fixed-KL-radius GMMPPO. `beta` is beta_0 and must be negative in this mode.
fixed_radius: false
kl_radius: 0.1
dual_lr: 1.
dual_ema_decay: 0.9
kl_violation_clip: 0.5  # relative bound: actual clip = value * kl_radius
dual_update_mode: beta  # lambda (standard dual) or beta (naive direct beta)
dual_lambda_min: 0.01
dual_lambda_max: 10.0
dual_beta_min: -150.0
dual_beta_max: -0.1

#sampler cfg
sampler_update_freq : 1           #set 10 to take long horizon information despite of policy_updates.
n_sampler_iters : 1                #need to consider in flow 
success_threshold : .6
success_rate_condition : 0.7
trust_region_threshold: 0.005
gamma : 0.
beta : -5.
use_scheduling : False
# misc
save_video: true
save_agent: true
rscope_envs: 16
rscope: false
seed: 42

# convenience
work_dir: ???
# task_title: ???
# multitask: ???
# tasks: ???
# obs_shape: ???
# action_dim: ???
# episode_length: ???
# obs_shapes: ???
# action_dims: ???
# episode_lengths: ???
# seed_steps: ???
# bin_size: ???

#simba
simba : false

#tdmpc
horizon: 3

#m2td3
omega_distance_threshold: 0.1
